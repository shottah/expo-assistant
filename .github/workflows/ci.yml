name: CI

on:
  pull_request:
  push:
    branches: [development, main]

# Sequential gates with parallel native branches.
#
#   build + lint
#         │
#         ▼
#       js test (unit + bridge contracts)
#         │   ↑ The `test:gated` script (scripts/test-gate.mjs) diffs
#         │     against the previous HEAD / PR base and exits 0 with
#         │     no work if nothing test-relevant changed. Native tests
#         │     deliberately do NOT use this gate — they're a separate
#         │     concern with their own skip behaviour (`if: false`).
#    ┌────┴────┐
#    ▼         ▼
# ios        android
# module     module     ← both currently skipped via `if: false`
#    │         │
#    ▼         ▼
# ios-e2e   android-e2e ← both currently skipped via `if: false`
#
# When re-enabling the native module / e2e jobs, drop the `if: false`
# AND add an `environment:` block if you want the run gated by manual
# approval (e.g. `environment: native-tests` after creating the env in
# repo settings with at least one required reviewer).

jobs:
  build-and-lint:
    name: build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  js-test:
    name: js test
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` so the gate script can `git diff` against the
      # PR base / previous push commit. Shallow clones (depth=1) lose
      # the base reference and force the script into the "run anyway"
      # fallback, which defeats the optimization.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # All JS tests — unit suites (VoiceAssistant, VoiceIntentBuilder,
      # plugin) plus the bridge contract suites (NativeModuleContract,
      # CrossPlatformContract).
      #
      # `test:gated` short-circuits with exit 0 + no work if the diff
      # since the base ref doesn't touch any test-relevant files. PR
      # events compare against the PR base SHA; push events use the
      # push's `before` SHA. See scripts/test-gate.mjs for the path
      # patterns + behaviour.
      - name: Run tests (gated, with coverage)
        env:
          GATE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: bun run test:gated -- --ci --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: js
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-js
          path: coverage

  ios-module-test:
    name: ios module (XCTest)
    needs: js-test
    runs-on: macos-15
    # Skipped while iOS native test execution is unstabilized in CI.
    # The scaffolding (target wiring, XCTest invocation, coverage
    # upload) is preserved below so flipping back on means dropping
    # the `if: false` — no rewrite needed. If you also want manual
    # approval before each run, add `environment: native-tests` and
    # create that env in repo settings with a required reviewer.
    if: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install module dependencies
        run: bun install --frozen-lockfile

      - name: Install example dependencies
        working-directory: example
        run: bun install --frozen-lockfile

      - name: Generate ios project
        working-directory: example
        run: bunx expo prebuild --platform ios --clean --no-install

      # Adds an ExpoAssistantTests target to the example xcodeproj AND
      # appends a matching `target` block to the Podfile so CocoaPods
      # installs the package's s.test_spec. See script for why this is
      # needed (autolinked pods don't get their test_specs).
      - name: Wire iOS test target
        run: ruby scripts/add-ios-test-target.rb

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: example/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/ExpoAssistant.podspec', 'example/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install pods
        working-directory: example/ios
        run: pod install --repo-update

      - name: Run XCTest suite
        working-directory: example/ios
        run: |
          xcodebuild test \
            -workspace expoassistantexample.xcworkspace \
            -scheme ExpoAssistant-Unit-Tests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -sdk iphonesimulator \
            -resultBundlePath test-results.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Convert xcresult to cobertura XML
        working-directory: example/ios
        run: |
          brew install a7ex/homebrew-formulae/xcresultparser
          xcresultparser --output-format cobertura test-results.xcresult > coverage.xml

      - name: Upload iOS coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: example/ios/coverage.xml
          flags: ios
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload xcresult artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-result
          path: example/ios/test-results.xcresult

  ios-e2e:
    name: ios example app e2e (skipped)
    needs: ios-module-test
    runs-on: macos-15
    # Skipped: iOS e2e plumbing (Maestro on iOS simulator) is unwired.
    # Flip to `if: true` once an iOS Maestro flow + a stable simulator
    # boot sequence are in place.
    if: false
    steps:
      - uses: actions/checkout@v4
      - run: echo "iOS e2e is a placeholder. Flip the job-level \`if\` to enable."

  android-module-test:
    name: android module (JUnit + JaCoCo)
    needs: js-test
    runs-on: ubuntu-latest
    # Skipped — paired with ios-module-test above. The Gradle scaffold,
    # JaCoCo report, and Codecov upload below stay in place so the job
    # re-enables cleanly. Add `environment: native-tests` if you want
    # the manual-approval gate.
    if: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install module dependencies
        run: bun install --frozen-lockfile

      - name: Install example dependencies
        working-directory: example
        run: bun install --frozen-lockfile

      - name: Generate android project
        working-directory: example
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('example/android/**/*.gradle*', 'example/android/**/gradle-wrapper.properties', 'android/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests + JaCoCo report
        working-directory: example/android
        run: ./gradlew :expo-assistant:jacocoTestReport --stacktrace

      - name: Upload Android coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: example/android/expo-assistant/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: android
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            example/android/expo-assistant/build/reports/tests
            example/android/expo-assistant/build/reports/jacoco

  android-e2e:
    name: android example app e2e (skipped)
    needs: android-module-test
    runs-on: ubuntu-latest
    # Skipped: emulator boot + Maestro flow is currently flaky and the
    # example app initialization needs to tolerate emulators without
    # speech-recognition support. Flip to `if: true` after both are
    # addressed.
    if: false
    steps:
      - uses: actions/checkout@v4
      - run: echo "Android e2e is a placeholder. Flip the job-level \`if\` to enable."
