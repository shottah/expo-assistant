name: CI

on:
  pull_request:
  push:
    branches: [development, main]

jobs:
  verify:
    name: JS / TS / plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test (with coverage)
        run: bun run test --ci --coverage

      - name: Build
        run: bun run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: js
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-js
          path: coverage

  android-test:
    name: Android (JUnit / MockK / Robolectric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install module dependencies
        run: bun install --frozen-lockfile

      - name: Install example dependencies
        working-directory: example
        run: bun install --frozen-lockfile

      - name: Generate android project
        working-directory: example
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('example/android/**/*.gradle*', 'example/android/**/gradle-wrapper.properties', 'android/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests + JaCoCo report
        working-directory: example/android
        run: ./gradlew :expo-assistant:jacocoTestReport --stacktrace

      - name: Upload Android coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: example/android/expo-assistant/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: android
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            example/android/expo-assistant/build/reports/tests
            example/android/expo-assistant/build/reports/jacoco

  ios-build:
    name: iOS (build verification)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install module dependencies
        run: bun install --frozen-lockfile

      - name: Install example dependencies
        working-directory: example
        run: bun install --frozen-lockfile

      - name: Generate ios project
        working-directory: example
        run: bunx expo prebuild --platform ios --clean --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: example/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/ExpoAssistant.podspec', 'example/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install pods
        working-directory: example/ios
        run: pod install --repo-update

      # NOTE: test execution is deferred. CocoaPods 1.16 + React Native
      # static_framework + s.test_spec do not produce a runnable test
      # scheme. The Swift test file at ios/Tests/ExpoAssistantTests.swift
      # exists and compiles under @testable import, but the test action
      # isn't wired. This job verifies the production module compiles —
      # catches the kind of malformed-AsyncFunction regression that
      # silently shipped before this PR.
      - name: Build ExpoAssistant pod
        working-directory: example/ios
        run: |
          xcodebuild build \
            -workspace expoassistantexample.xcworkspace \
            -scheme ExpoAssistant \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
