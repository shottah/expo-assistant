name: CI

on:
  pull_request:
  push:
    branches: [development, main]

# Sequential gates with parallel native branches. Fast cheap jobs run
# first; expensive native + e2e jobs only spin up if the cheap gates
# pass AND a reviewer approves the `native-tests` environment.
#
#   build + lint
#         │
#         ▼
#       js test (unit + bridge contracts)
#         │
#    ┌────┴────┐  ← native-tests environment requires manual approval
#    ▼         ▼
# ios        android
# module     module
#    │         │
#    ▼         ▼
# ios-e2e   android-e2e   ← both currently skipped via `if: false`

jobs:
  build-and-lint:
    name: build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  js-test:
    name: js test
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # All JS tests — unit suites (VoiceAssistant, VoiceIntentBuilder,
      # plugin, integration) plus the bridge contract suites
      # (NativeModuleContract, CrossPlatformContract).
      - name: Run tests (with coverage)
        run: bun run test --ci --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: js
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-js
          path: coverage

  ios-module-test:
    name: ios module (XCTest)
    needs: js-test
    runs-on: macos-15
    # `native-tests` environment must exist in repo settings with at
    # least one required reviewer. Until a reviewer approves the run,
    # this job (and its e2e descendant) stay paused. See README for
    # one-time setup instructions.
    environment: native-tests
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install module dependencies
        run: bun install --frozen-lockfile

      - name: Install example dependencies
        working-directory: example
        run: bun install --frozen-lockfile

      - name: Generate ios project
        working-directory: example
        run: bunx expo prebuild --platform ios --clean --no-install

      # Adds an ExpoAssistantTests target to the example xcodeproj AND
      # appends a matching `target` block to the Podfile so CocoaPods
      # installs the package's s.test_spec. See script for why this is
      # needed (autolinked pods don't get their test_specs).
      - name: Wire iOS test target
        run: ruby scripts/add-ios-test-target.rb

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: example/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/ExpoAssistant.podspec', 'example/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install pods
        working-directory: example/ios
        run: pod install --repo-update

      - name: Run XCTest suite
        working-directory: example/ios
        run: |
          xcodebuild test \
            -workspace expoassistantexample.xcworkspace \
            -scheme ExpoAssistant-Unit-Tests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -sdk iphonesimulator \
            -resultBundlePath test-results.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Convert xcresult to cobertura XML
        working-directory: example/ios
        run: |
          brew install a7ex/homebrew-formulae/xcresultparser
          xcresultparser --output-format cobertura test-results.xcresult > coverage.xml

      - name: Upload iOS coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: example/ios/coverage.xml
          flags: ios
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload xcresult artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-result
          path: example/ios/test-results.xcresult

  ios-e2e:
    name: ios example app e2e (skipped)
    needs: ios-module-test
    runs-on: macos-15
    # Skipped: iOS e2e plumbing (Maestro on iOS simulator) is unwired.
    # Flip to `if: true` once an iOS Maestro flow + a stable simulator
    # boot sequence are in place.
    if: false
    steps:
      - uses: actions/checkout@v4
      - run: echo "iOS e2e is a placeholder. Flip the job-level \`if\` to enable."

  android-module-test:
    name: android module (JUnit + JaCoCo)
    needs: js-test
    runs-on: ubuntu-latest
    environment: native-tests
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install module dependencies
        run: bun install --frozen-lockfile

      - name: Install example dependencies
        working-directory: example
        run: bun install --frozen-lockfile

      - name: Generate android project
        working-directory: example
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('example/android/**/*.gradle*', 'example/android/**/gradle-wrapper.properties', 'android/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests + JaCoCo report
        working-directory: example/android
        run: ./gradlew :expo-assistant:jacocoTestReport --stacktrace

      - name: Upload Android coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: example/android/expo-assistant/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: android
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            example/android/expo-assistant/build/reports/tests
            example/android/expo-assistant/build/reports/jacoco

  android-e2e:
    name: android example app e2e (skipped)
    needs: android-module-test
    runs-on: ubuntu-latest
    # Skipped: emulator boot + Maestro flow is currently flaky and the
    # example app initialization needs to tolerate emulators without
    # speech-recognition support. Flip to `if: true` after both are
    # addressed.
    if: false
    steps:
      - uses: actions/checkout@v4
      - run: echo "Android e2e is a placeholder. Flip the job-level \`if\` to enable."
