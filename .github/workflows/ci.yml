name: CI

on:
  pull_request:
  push:
    branches: [development, main]

# Sequential gates with parallel native branches. Fast cheap jobs run
# first; expensive native + e2e jobs only spin up if the cheap gates
# pass. Saves runner minutes and gives faster failure feedback.
#
#   build-and-lint
#         │
#         ▼
#   js-unit-test
#         │
#         ▼
#   js-bridge-test
#         │
#    ┌────┴────┐
#    ▼         ▼
# ios-       android-
# module-    module-
# test       test
#    │         │
#    ▼         ▼
# ios-e2e   android-e2e   ← both currently skipped via `if: false`

jobs:
  build-and-lint:
    name: 1 · build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  js-unit-test:
    name: 2 · js unit tests
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Skip the contract suites — those run as their own bridge gate.
      - name: Run unit tests (with coverage)
        run: bun run test --ci --coverage --testPathIgnorePatterns "Contract\.test\.ts"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: js
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-js
          path: coverage

  js-bridge-test:
    name: 3 · js bridge contracts
    needs: js-unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Contract tests pin the JS↔native interface — verify TS shim
      # method names + iOS Swift + Android Kotlin AsyncFunction
      # registrations all agree.
      - name: Run bridge contract tests
        run: bun run test --ci --testPathPattern "Contract\.test\.ts"

  ios-module-test:
    name: 4a · ios module (build verification)
    needs: js-bridge-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install module dependencies
        run: bun install --frozen-lockfile

      - name: Install example dependencies
        working-directory: example
        run: bun install --frozen-lockfile

      - name: Generate ios project
        working-directory: example
        run: bunx expo prebuild --platform ios --clean --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: example/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/ExpoAssistant.podspec', 'example/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install pods
        working-directory: example/ios
        run: pod install --repo-update

      # NOTE: test EXECUTION is not yet wired. The Swift test file at
      # ios/Tests/ExpoAssistantTests.swift exists and compiles under
      # @testable import, but CocoaPods 1.16 + RN static_framework +
      # s.test_spec do not produce a runnable test scheme. This job
      # build-verifies the production module — catches the kind of
      # malformed-AsyncFunction regression that silently shipped before.
      - name: Build ExpoAssistant pod
        working-directory: example/ios
        run: |
          xcodebuild build \
            -workspace expoassistantexample.xcworkspace \
            -scheme ExpoAssistant \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

  ios-e2e:
    name: 5a · ios example app e2e (skipped)
    needs: ios-module-test
    runs-on: macos-15
    # Skipped: iOS e2e plumbing (Maestro on iOS simulator) is unwired.
    # Flip to `if: true` once an iOS Maestro flow + a stable simulator
    # boot sequence are in place.
    if: false
    steps:
      - uses: actions/checkout@v4
      - run: echo "iOS e2e is a placeholder. Flip the job-level \`if\` to enable."

  android-module-test:
    name: 4b · android module (JUnit + JaCoCo)
    needs: js-bridge-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install module dependencies
        run: bun install --frozen-lockfile

      - name: Install example dependencies
        working-directory: example
        run: bun install --frozen-lockfile

      - name: Generate android project
        working-directory: example
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('example/android/**/*.gradle*', 'example/android/**/gradle-wrapper.properties', 'android/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests + JaCoCo report
        working-directory: example/android
        run: ./gradlew :expo-assistant:jacocoTestReport --stacktrace

      - name: Upload Android coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: example/android/expo-assistant/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: android
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            example/android/expo-assistant/build/reports/tests
            example/android/expo-assistant/build/reports/jacoco

  android-e2e:
    name: 5b · android example app e2e (skipped)
    needs: android-module-test
    runs-on: ubuntu-latest
    # Skipped: emulator boot + Maestro flow is currently flaky and the
    # example app initialization needs to tolerate emulators without
    # speech-recognition support. Flip to `if: true` after both are
    # addressed.
    if: false
    steps:
      - uses: actions/checkout@v4
      - run: echo "Android e2e is a placeholder. Flip the job-level \`if\` to enable."
