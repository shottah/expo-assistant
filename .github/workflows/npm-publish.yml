name: npm-publish

# Two triggers, same destination:
#
#   - workflow_dispatch — fired by release-please.yml via
#     `gh workflow run npm-publish.yml --ref <tag>` after it cuts a
#     new release. This is the primary path for automated releases.
#     `workflow_dispatch` is one of two event types GitHub exempts
#     from the GITHUB_TOKEN trigger-suppression guardrail, which is
#     why release-please can chain into it.
#
#   - push:tags v* — fallback for manual tag pushes (`git tag v0.x.y
#     && git push --tags` from a developer machine). Such pushes
#     originate from a real user, so the guardrail doesn't apply and
#     this trigger fires normally.
#
# The actual publish work + the npm-release approval gate are identical
# regardless of which trigger fired.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.0). Used for the GH UI history + audit trail; the checkout uses github.ref which is set by the --ref passed to `gh workflow run`.'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Manual-approval gate before the package goes live on npm. The
    # GitHub Release itself is created by release-please when the
    # release-please PR is merged — that happens BEFORE the v* tag
    # is pushed, so this gate blocks the npm publish step only. The
    # GitHub Release stays published regardless.
    #
    # ONE-TIME SETUP: create the `npm-release` environment in repo
    # settings (Settings → Environments → New environment), add at
    # least one Required reviewer. Until a reviewer approves the run
    # for a given tag, this job stays paused — `npm view` won't show
    # the new version even though the v* tag + GH Release exist.
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/expo-assistant
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      # npm is still required for `npm publish --provenance`; bun publish
      # doesn't yet emit npm provenance attestations.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
